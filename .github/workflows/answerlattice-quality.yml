name: Answerlattice Quality

on:
  pull_request:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: answerlattice-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify governed-answer runtime
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.1
          cache: npm
          cache-dependency-path: |
            package-lock.json
            functions-answerlattice/package-lock.json

      - name: Set up Java for Firebase emulators
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install root dependencies
        run: npm ci

      - name: Install Answerlattice Functions dependencies
        run: npm --prefix functions-answerlattice ci

      - name: Install pinned Firebase CLI
        run: npm install --global firebase-tools@14.15.1

      - name: Verify dependency freeze
        run: npm run verify:dependency-freeze

      - name: Verify dependency security policy
        run: npm run verify:answerlattice-security-audit

      - name: Verify backup and recovery contracts
        run: npm run verify:answerlattice-backup-recovery

      - name: Build Answerlattice Functions
        run: npm --prefix functions-answerlattice run build

      - name: Type-check Answerlattice application surface
        run: npm run typecheck:answerlattice

      - name: Build Answerlattice browser helper
        run: npm --prefix packages/answerlattice-web run build

      - name: Verify final readiness source gates
        run: npm run verify:answerlattice-final-readiness

      - name: Verify Answerlattice runtime and Firebase emulator contracts
        run: npm run verify:answerlattice-runtime-truth
