<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" role="img" aria-labelledby="menu-link-import-title menu-link-import-desc">
  <title id="menu-link-import-title">Menu link import workflow</title>
  <desc id="menu-link-import-desc">An owner-provided public menu link passes through permission and safe acquisition checks, becomes a private MenuList draft, and waits for owner review before publishing.</desc>
  <defs>
    <marker id="menu-link-import-arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M1 1l8 4-8 4" fill="none" stroke="#0051D1" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <style>
      .panel{fill:#fff;stroke:#dbe4f0;stroke-width:2}
      .soft{fill:#f8fafc}
      .softBlue{fill:#eff6ff}
      .softTeal{fill:#ecfdf5}
      .ink{fill:#0f172a}
      .body{fill:#475569}
      .blue{fill:#0051d1}
      .teal{fill:#0f766e}
      .line{stroke:#dbe4f0;stroke-width:2;fill:none;stroke-linecap:round;stroke-linejoin:round}
      .blueLine{stroke:#0051d1;stroke-width:2.5;fill:none;stroke-linecap:round;stroke-linejoin:round}
      .tealLine{stroke:#0f766e;stroke-width:2.5;fill:none;stroke-linecap:round;stroke-linejoin:round}
      .label{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;font-size:18px;font-weight:760;letter-spacing:0}
      .small{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;font-size:13px;font-weight:680;letter-spacing:0}
      .micro{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;font-size:11px;font-weight:760;letter-spacing:0;text-transform:uppercase}
    </style>
  </defs>

  <g id="source-link">
    <rect class="panel" x="64" y="126" width="256" height="252" rx="18"/>
    <rect class="soft" x="86" y="150" width="212" height="34" rx="10"/>
    <path class="line" d="M104 167h21m16 0h118"/>
    <text class="micro blue" x="86" y="111">Owner source</text>
    <text class="label ink" x="86" y="218">Existing menu link</text>
    <text class="small body" x="86" y="244">The owner pastes a public</text>
    <text class="small body" x="86" y="264">menu URL they control or</text>
    <text class="small body" x="86" y="284">have permission to import.</text>

    <g id="source-menu-lines">
      <rect class="softBlue" x="86" y="310" width="212" height="44" rx="12"/>
      <path class="blueLine" d="M108 330h74"/>
      <path class="line" d="M108 342h138"/>
      <path class="line" d="M252 330h24"/>
    </g>
  </g>

  <path id="source-to-gate" class="blueLine" d="M332 252h83" marker-end="url(#menu-link-import-arrow)"/>

  <g id="safety-gate">
    <rect class="panel" x="422" y="82" width="160" height="396" rx="20"/>
    <text class="micro blue" x="456" y="121">Safety gate</text>

    <g id="permission-check">
      <rect class="softTeal" x="448" y="154" width="108" height="92" rx="14"/>
      <rect x="472" y="179" width="22" height="22" rx="5" fill="#fff" stroke="#0f766e" stroke-width="2"/>
      <path class="tealLine" d="M477 190l6 6 14-16"/>
      <text class="small ink" x="472" y="222">Permission</text>
      <text class="small teal" x="472" y="239">confirmed</text>
    </g>

    <path class="line" d="M502 262v44"/>

    <g id="safe-acquisition-check">
      <rect class="softBlue" x="448" y="322" width="108" height="104" rx="14"/>
      <path class="blueLine" d="M476 353h52"/>
      <path class="blueLine" d="M476 372h36"/>
      <path class="line" d="M476 391h52"/>
      <text class="small ink" x="472" y="415">Safe read</text>
    </g>
  </g>

  <path id="gate-to-draft" class="blueLine" d="M594 252h83" marker-end="url(#menu-link-import-arrow)"/>

  <g id="review-draft">
    <rect class="panel" x="690" y="104" width="214" height="312" rx="20"/>
    <text class="micro blue" x="714" y="145">MenuList draft</text>
    <text class="label ink" x="714" y="177">Review before publish</text>
    <text class="small body" x="714" y="202">Nothing changes publicly</text>
    <text class="small body" x="714" y="222">until the owner approves.</text>

    <g id="draft-preview">
      <rect class="soft" x="714" y="252" width="166" height="104" rx="14"/>
      <path class="line" d="M736 280h66"/>
      <path class="line" d="M736 304h90"/>
      <path class="line" d="M736 328h74"/>
      <rect x="826" y="272" width="32" height="18" rx="9" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
      <rect x="826" y="296" width="32" height="18" rx="9" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
      <rect x="826" y="320" width="32" height="18" rx="9" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
    </g>

    <g id="owner-actions">
      <rect x="714" y="374" width="70" height="26" rx="13" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
      <text class="small blue" x="733" y="392">Apply</text>
      <rect x="794" y="374" width="86" height="26" rx="13" fill="#fff" stroke="#dbe4f0" stroke-width="1.5"/>
      <text class="small body" x="811" y="392">Discard</text>
    </g>
  </g>

  <g id="private-artifact-path">
    <path d="M174 514h612" fill="none" stroke="#dbe4f0" stroke-width="2" stroke-dasharray="8 10" stroke-linecap="round"/>
    <rect class="soft" x="356" y="490" width="248" height="48" rx="24" stroke="#dbe4f0" stroke-width="2"/>
    <text class="small body" x="388" y="520">Private source artifact, not public output</text>
  </g>
</svg>
