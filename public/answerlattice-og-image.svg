<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Answerlattice social preview</title>
  <desc id="desc">The governed source behind customer answers. Keep approved product knowledge structured, reviewable, and current across support, docs, search, and AI-assisted surfaces.</desc>
  <defs>
    <radialGradient id="al-orb-right" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#064e3b" stop-opacity="0.56"/>
      <stop offset="1" stop-color="#064e3b" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="al-orb-left" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#0f766e" stop-opacity="0.24"/>
      <stop offset="1" stop-color="#0f766e" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="al-title" x1="82" y1="0" x2="650" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.52" stop-color="#ccfbf1"/>
      <stop offset="1" stop-color="#5eead4"/>
    </linearGradient>
    <pattern id="al-dot-grid" width="64" height="64" patternUnits="userSpaceOnUse">
      <circle cx="6" cy="6" r="2" fill="#5eead4" opacity="0.14"/>
    </pattern>
  </defs>
  <rect width="1200" height="630" fill="#070714"/>
  <rect width="1200" height="630" fill="url(#al-dot-grid)" opacity="0.72"/>
  <circle cx="978" cy="116" r="258" fill="url(#al-orb-right)"/>
  <circle cx="170" cy="535" r="220" fill="url(#al-orb-left)"/>
  <image href="data:image/svg+xml;base64," x="82" y="82" width="150" height="93" preserveAspectRatio="xMidYMid meet"/>
  <text x="82" y="245" fill="url(#al-title)" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="78" font-weight="800" letter-spacing="0">Answerlattice</text>
  <text x="82" y="330" fill="#ffffff" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="56" font-weight="760" letter-spacing="0">The governed source behind customer</text>
  <text x="82" y="394" fill="#ffffff" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="56" font-weight="760" letter-spacing="0">answers.</text>
  <text x="82" y="462" fill="#a0a0c0" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="25" font-weight="450">Keep approved product knowledge structured, reviewable, and current</text>
  <text x="82" y="495" fill="#a0a0c0" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="25" font-weight="450">across support, docs, search, and AI-assisted surfaces.</text>
  <line x1="82" y1="555" x2="1118" y2="555" stroke="#ffffff" stroke-opacity="0.09"/>
  <text x="82" y="590" fill="#5eead4" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="24" font-weight="800">answerlattice.com</text>
</svg>
